[package]
name    = "lsm-db"
version = "1.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Log-structured merge-tree storage engine for Rust. Memtable, leveled SSTables, background compaction, and bloom-filtered point reads over a durable wal-db log. A composable storage engine for embedded databases and Hive DB."

# Keywords (5 max)
keywords = [
    "lsm-tree",
    "storage-engine",
    "database",
    "compaction",
    "key-value"
]

# Categories
categories = [
    "database-implementations",
    "data-structures",
    "filesystem"
]

# Links
homepage      = "https://github.com/jamesgober/lsm-db"
repository    = "https://github.com/jamesgober/lsm-db"
documentation = "https://docs.rs/lsm-db"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lsm_db"
path = "src/lib.rs"

# `loom` is a custom cfg set via `RUSTFLAGS="--cfg loom"` for the concurrency
# model checks; it is declared here to satisfy the `unexpected_cfgs` lint under
# `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Standard library: the storage engine, the `error-forge` integration, and
# run-time CRC32C hardware detection (`src/crc.rs`).
std = ["alloc", "dep:error-forge"]
# Heap allocation without `std`: the in-memory run codec (`format::RunWriter`,
# `format::RunReader`). Without it a `no_std` build still has `format::crc32c`
# and the error type.
alloc = []
# Crash-safe memtable durability via `wal-db`.
durability = ["std", "dep:wal-db"]
# Bloom-filtered SSTable point lookups: a per-run filter (persisted in a
# sidecar file via `postcard`) lets a point read skip any run that cannot
# contain the key.
bloom = ["std", "dep:bloom-lib", "dep:postcard"]


# DEPENDENCIES
# #################################
[dependencies]
# Domain error type. Portfolio crates standardise on `error-forge` for stable
# error metadata (kind/caption/is_fatal) instead of thiserror/anyhow. Default
# features are off — only the `ForgeError` trait is needed. It requires `std`,
# so it is pulled in by the `std` feature.
error-forge = { version = "1.1", optional = true, default-features = false }


# First-party primitives, each behind its own additive feature flag: durability
# (0.4) and bloom (0.5). Optional so the default build pulls neither.
wal-db    = { version = "1.2", optional = true, default-features = false }
# `serde` so a built filter can be persisted to / loaded from its sidecar; the
# default hasher is fixed-seed, so a reloaded filter answers identically.
# Pinned: the sidecar bytes are frozen for 1.x, and bloom-lib promises no
# stable byte layout until its versioned format (planned for its 2.0). The
# golden test in `src/bloom.rs` fails on any change.
bloom-lib = { version = "=1.0.0", optional = true, default-features = false, features = ["std", "serde"] }

# Compact, no_std, serde-based codec for the bloom-filter sidecar files. Pulled
# only by the `bloom` feature. Held to 1.1 patch releases for the same reason;
# an exact pin would stop a downstream build that needs another 1.1 patch.
postcard  = { version = ">=1.1.3, <1.2", optional = true, default-features = false, features = ["alloc"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Reference implementation for the CRC32C tests and benchmark, so the `no_std`
# paths are checked against it even when the `std` feature is off.
crc32c    = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
tempfile  = "3"
# Comparative benchmark only (`benches/comparison.rs`): two mature pure-Rust
# embedded key-value stores to measure lsm-db against. Dev-only — never part of
# the published dependency graph.
sled      = "0.34"
redb      = "2"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# EXAMPLES
# #################################
# Most examples use only the default surface and are auto-discovered. These two
# demonstrate feature-gated behaviour, so they require their feature to build.
[[example]]
name              = "durable_store"
required-features = ["durability"]

[[example]]
name              = "bloom_point_reads"
required-features = ["bloom"]


# BENCHMARKS
# #################################
[[bench]]
name    = "lsm_bench"
harness = false

[[bench]]
name    = "comparison"
harness = false

[[bench]]
name    = "crc"
harness = false

[[bench]]
name    = "checksum_paths"
harness = false

[[bench]]
name    = "scan_range"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
